name: Build project and run tests
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repo
      uses: actions/checkout@v6

    - name: Set up OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: "5.1.1"
        opam-disable-sandboxing: true

    - name: Install dependencies
      run: opam install . --deps-only --with-test

    - name: Build project
      run: opam exec -- dune build

    - name: Run tests
      id: test
      run: |
        ALCOTEST_COLOR=never opam exec -- dune runtest 2> test_output.txt

    - name: Process test output
      uses: georgejkaye/alcotest-github-action@v0.2.0
      with:
        test-output: test_output.txt
        output-file: alcotest.json

    - name: Upload test results artifact
      uses: actions/upload-artifact@v7
      with:
          name: Alcotest results
          path: alcotest.json
